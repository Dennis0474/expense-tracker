<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <h1>Expense Tracker</h1>
      </header>

      <section class="summary" aria-label="Financial summary">
        <div class="card card-balance">
          <span class="card-label">Balance</span>
          <span class="card-amount" id="balance">$0.00</span>
        </div>
        <div class="card card-income">
          <span class="card-label">Total Income</span>
          <span class="card-amount" id="total-income">$0.00</span>
        </div>
        <div class="card card-expense">
          <span class="card-label">Total Expenses</span>
          <span class="card-amount" id="total-expenses">$0.00</span>
        </div>
      </section>

      <section class="filters" aria-label="Filter by category">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="food">Food</button>
        <button class="filter-btn" data-category="transport">Transport</button>
        <button class="filter-btn" data-category="salary">Salary</button>
        <button class="filter-btn" data-category="utilities">Utilities</button>
        <button class="filter-btn" data-category="other">Other</button>
      </section>

      <main class="main-content">
        <section class="form-section" aria-label="Add a transaction">
          <h2>Add a Transaction</h2>

          <div class="form-group">
            <label for="description">Description</label>
            <input
              type="text"
              id="description"
              placeholder="e.g. Grocery shopping"
            />
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input
              type="number"
              id="amount"
              placeholder="0.00"
              min="0"
              step="0.01"
            />
          </div>

          <div class="form-group">
            <label>Type</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="type" value="income" checked />
                Income
              </label>
              <label class="radio-label">
                <input type="radio" name="type" value="expense" />
                Expense
              </label>
            </div>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="salary">Salary</option>
              <option value="utilities">Utilities</option>
              <option value="other">Other</option>
            </select>
          </div>

          <button class="btn-add" id="add-btn">+ Add Transaction</button>
        </section>

        <section class="list-section" aria-label="Transaction history">
          <h2>Transactions</h2>
          <ul class="transaction-list" id="transaction-list"></ul>
          <p class="empty-state" id="empty-state" hidden>
            No transactions yet. Add one above!
          </p>
        </section>
      </main>
    </div>

    <script src="js/Transaction.js"></script>
    <script src="js/TransactionManager.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
